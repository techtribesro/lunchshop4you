<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oběd — týdenní objednávka</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}" />
</head>
<body>
  <div class="topbar">
    <div class="wordmark"><span class="glyph">Ob</span>ěd</div>
    <nav class="view-nav">
      <a href="/modes">Výběr režimu</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="user-chip">
      <span class="username">{{ user.username }}</span>
    </div>
    <button class="link-btn" type="button" id="logout-btn">Odhlásit</button>
  </div>

  <main class="screen active">
    <h1>Týdenní objednávka</h1>
    <p>Průvodce týdenní objednávkou se právě připravuje.</p>
    <p>Zatím prosím použijte <a href="/orders">klasickou objednávku</a>,
       nebo se vraťte na <a href="/modes">výběr režimu</a>.</p>
  </main>

  <script>
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await fetch("/logout", { method: "POST" });
      window.location.href = "/login";
    });
  </script>
</body>
</html>
