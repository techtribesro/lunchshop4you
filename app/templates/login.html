<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Matches --paper in each theme (app.css:97 light, app.css:126/152 dark) so
       mobile browser chrome stops rendering a light band above a dark page.
       app.css:102 already declares color-scheme: light dark; this is the other
       half of that pair. Values copied from the tokens, not invented. -->
  <meta name="theme-color" content="#eef3f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050f1d" media="(prefers-color-scheme: dark)" />
  <title>Oběd — přihlášení</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-mark">
        <img class="brand-logo" src="/static/gs4u_logo.png?v={{ css_version }}"
             width="600" height="156" alt="golfshop4you — obědy" />
      </div>
      <p class="login-sub">týdenní menu &amp; objednávky</p>

      <form id="login-form">
        <div class="field">
          <label for="u">Uživatelské jméno</label>
          <input id="u" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="p">Heslo</label>
          <input id="p" name="password" type="password" autocomplete="current-password" required />
        </div>
        <!-- role=alert + aria-live: a failed login is the one place a user is
             BLOCKED until they react, and it was previously announced to
             sighted users only (t1 audit, login.html:27). Kept in the DOM at
             all times so the live region is registered before it populates.
             Styling moved to .login-error: the old inline font-size:13px was
             not on the 9-step type scale. -->
        <p id="login-error" class="login-error" role="alert" aria-live="polite" hidden></p>
        <button class="btn-primary" type="submit">Přihlásit se</button>
      </form>
      <p class="login-foot">Zapomenuté heslo? Napište adminovi.</p>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.hidden = true;

      const form = e.target;
      const username = form.username.value;
      const password = form.password.value;

      const resp = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });

      if (resp.ok) {
        // Must match POST_LOGIN_PATH in app/routers/pages.py. The server-side
        // redirects never fire on this path -- the form posts via fetch and
        // navigates itself -- so leaving this as "/orders" would skip the mode
        // chooser entirely for every real login.
        window.location.href = "/modes";
      } else {
        const body = await resp.json().catch(() => ({}));
        errorEl.textContent = body.detail || "Přihlášení se nezdařilo.";
        errorEl.hidden = false;
      }
    });
  </script>
</body>
</html>
