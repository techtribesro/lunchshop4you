app = "lunchshop4you"
primary_region = "fra"

[build]

[env]
  DATABASE_PATH = "/data/lunchshop.db"
  # GOOGLE_SERVICE_ACCOUNT_JSON and GOOGLE_SHEETS_SPREADSHEET_ID are set via
  # `fly secrets set` (inline JSON content, not a file path -- Fly secrets
  # are env-only, no file mounts).
  GMAIL_IMAP_HOST = "imap.gmail.com"
  GMAIL_IMAP_USER = "lunchshop4you@gmail.com"
  GMAIL_SMTP_HOST = "smtp.gmail.com"
  GMAIL_SMTP_PORT = "587"
  MENU_EMAIL_SENDER = ""
  ORDER_CUTOFF_TIME = "11:30"
  ORDER_SUMMARY_SEND_TIME = "11:35"
  ORDER_SUMMARY_RECIPIENT_EMAIL = "jakob.r.jakov@gmail.com"
  ORDER_SUMMARY_RECIPIENT_NAME = "Honza"
  ORDER_SUMMARY_SENDER_NAME = "Yakob"
  ADMIN_USERNAME = "yakob"
  TIMEZONE = "Europe/Prague"

[mounts]
  source = "lunchshop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
