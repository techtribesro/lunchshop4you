app = "lunchshop4you"
primary_region = "fra"

[build]

[env]
  DATABASE_PATH = "/data/lunchshop.db"
  GOOGLE_SERVICE_ACCOUNT_JSON = "/secrets/service-account.json"

[mounts]
  source = "lunchshop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
