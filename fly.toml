app = "lunchshop4you"
primary_region = "fra"

[build]

[env]
  DATABASE_PATH = "/data/lunchshop.db"
  # GOOGLE_SERVICE_ACCOUNT_JSON and GOOGLE_SHEETS_SPREADSHEET_ID are set via
  # `fly secrets set` (inline JSON content, not a file path -- Fly secrets
  # are env-only, no file mounts).
  GMAIL_IMAP_HOST = "imap.gmail.com"
  GMAIL_IMAP_USER = "lunchshop4you@gmail.com"
  GMAIL_SMTP_HOST = "smtp.gmail.com"
  GMAIL_SMTP_PORT = "587"
  MENU_EMAIL_SENDER = "Restaurace@fmsczech.com"
  ORDER_SUMMARY_EMAIL_ENABLED = "false"
  ORDER_SUMMARY_RECIPIENT_EMAIL = "Restaurace@fmsczech.com"
  ORDER_SUMMARY_RECIPIENT_NAME = "Honza"
  ORDER_SUMMARY_SENDER_NAME = "golfshop4you"
  # TELEGRAM_BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET are set via
  # `fly secrets set` (they're credentials).
  ADMIN_USERNAME = "yakob"
  TIMEZONE = "Europe/Prague"
  GROQ_MODEL = "openai/gpt-oss-120b"

[mounts]
  source = "lunchshop_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # Bumped from 512mb: the PDF-menu LLM extraction path (pdfplumber text
  # extraction, scanned up to MAX_MESSAGES_TO_SCAN=20 times when force-
  # resolving a specific week) was pushing the process over 512mb and
  # getting OOM-killed, which is what silently dropped a week's import.
  memory = "1gb"
