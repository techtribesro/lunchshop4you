[project]
name = "lunchshop4you"
version = "0.1.0"
description = "Lunch ordering app for a small office"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "apscheduler>=3.10",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "pdfplumber>=0.11",
    "certifi>=2024.2.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
